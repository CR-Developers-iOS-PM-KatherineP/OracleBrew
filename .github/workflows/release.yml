name: iOS Release — build and upload to App Store Connect

on:
  push:
    branches: [ "release" ]
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version (e.g. 1.0.1). Empty keeps the project's own."
        required: false
        type: string
      skip_upload:
        description: "Build and validate, but don't upload to App Store Connect."
        required: false
        type: boolean
        default: false

env:
  XCODE_PROJECT: OracleBrew/OracleBrew.xcodeproj
  XCODE_SCHEME: OracleBrew
  APP_NAME: OracleBrew
  # Not a secret — the Team ID is printed inside every distributed build anyway.
  DEVELOPMENT_TEAM: "3ZVTHYFAJY"
  # Unlocks the throwaway keychain import-codesign-certs creates. Not a secret —
  # the keychain exists for the length of one runner and is deleted at the end.
  KEYCHAIN_PASSWORD: "temp_password"

jobs:
  build-and-upload:
    # macos-latest rather than a pinned image: setup-xcode can only select a
    # version the image already ships, and pinning both means guessing which
    # image carries Xcode 26.2. If the Xcode step ever fails to find it, that
    # pairing is what to look at.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        # Matches local development (LastUpgradeCheck 2620).
        xcode-version: '26.2'

    - name: Check required secrets
      env:
        BUNDLE_IDENTIFIER: ${{ secrets.BUNDLE_IDENTIFIER }}
        CERT: ${{ secrets.APPSTORE_CONNECT_CERTIFICATE }}
        CERT_PASSWORD: ${{ secrets.APPSTORE_CONNECT_CERTIFICATE_PASSWORD }}
        PROFILE: ${{ secrets.APPSTORE_CONNECT_PROVISIONING_PROFILE }}
        API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
        API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
        API_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY }}
      run: |
        # Fail here rather than 20 minutes into an archive: every one of these is
        # needed, and a missing one surfaces as a confusing signing error later.
        missing=""
        for name in BUNDLE_IDENTIFIER CERT CERT_PASSWORD PROFILE \
                    API_KEY_ID API_ISSUER_ID API_PRIVATE_KEY; do
          if [ -z "${!name}" ]; then missing="$missing $name"; fi
        done
        if [ -n "$missing" ]; then
          echo "❌ Missing repository secrets:$missing"
          echo "See docs/release.md for how to create them."
          exit 1
        fi
        echo "✅ All required secrets are present"

    - name: Import signing certificate
      uses: apple-actions/import-codesign-certs@v2
      with:
        p12-file-base64: ${{ secrets.APPSTORE_CONNECT_CERTIFICATE }}
        p12-password: ${{ secrets.APPSTORE_CONNECT_CERTIFICATE_PASSWORD }}
        p12-import-location: "file"
        create-keychain: true
        keychain-password: "temp_password"

    - name: Install provisioning profile
      env:
        PROFILE_BASE64: ${{ secrets.APPSTORE_CONNECT_PROVISIONING_PROFILE }}
      run: |
        set -euo pipefail

        echo "$PROFILE_BASE64" | base64 --decode > profile.mobileprovision
        if [ ! -s profile.mobileprovision ]; then
          echo "❌ Failed to decode the provisioning profile"
          exit 1
        fi

        PLIST=$(security cms -D -i profile.mobileprovision)
        UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$PLIST")
        NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$PLIST")
        PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' /dev/stdin <<< "$PLIST")
        EXPIRY=$(/usr/libexec/PlistBuddy -c 'Print ExpirationDate' /dev/stdin <<< "$PLIST")

        if [ -z "$UUID" ] || [ -z "$NAME" ]; then
          echo "❌ Could not read UUID/Name out of the profile"
          exit 1
        fi

        # The profile carries <TeamID>.<bundle id>; if it doesn't match what we're
        # about to build, signing succeeds and the App Store rejects the upload.
        EXPECTED="$DEVELOPMENT_TEAM.${{ secrets.BUNDLE_IDENTIFIER }}"
        if [ "$PROFILE_APP_ID" != "$EXPECTED" ]; then
          echo "❌ Profile is for '$PROFILE_APP_ID', build is '$EXPECTED'"
          exit 1
        fi

        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles/
        cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

        echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
        echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
        echo "✅ Installed '$NAME' ($UUID), expires $EXPIRY"

    - name: Resolve the signing identity
      run: |
        set -euo pipefail

        KEYCHAIN="$HOME/Library/Keychains/signing_temp.keychain-db"
        if [ ! -f "$KEYCHAIN" ]; then
          KEYCHAIN=$(security list-keychains -d user | tr -d ' "' | head -1)
        fi
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN" 2>/dev/null || true

        IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
          | grep -E "Apple Distribution|iPhone Distribution" \
          | head -1 | sed -E 's/.*"([^"]+)".*/\1/')

        if [ -z "$IDENTITY" ]; then
          echo "❌ No distribution identity in the keychain. Found:"
          security find-identity -v -p codesigning "$KEYCHAIN"
          exit 1
        fi

        echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
        echo "CODE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
        echo "✅ Signing as: $IDENTITY"

    - name: Pin the profile to the app target only
      run: |
        set -euo pipefail

        # Writes PROVISIONING_PROFILE_SPECIFIER into the app target's Release
        # config and strips it (and CODE_SIGN_ENTITLEMENTS) from every other
        # config in the project.
        #
        # Passing the specifier on the xcodebuild command line would be shorter,
        # but a CLI build setting applies to every target in the graph — including
        # Swift Package targets, which cannot carry a provisioning profile and
        # fail to sign. There are no packages here today; this keeps the build
        # working on the day one is added.
        python3 .github/scripts/exclude_spm_from_signing.py \
          "$XCODE_PROJECT/project.pbxproj" \
          "$PROFILE_UUID" \
          "$XCODE_SCHEME"

        # The runner's checkout is disposable, but make it obvious this is a
        # build-time edit and not something anyone should commit.
        git --no-pager diff --stat "$XCODE_PROJECT/project.pbxproj" || true

    - name: Build and archive
      env:
        BUNDLE_IDENTIFIER: ${{ secrets.BUNDLE_IDENTIFIER }}
        MARKETING_VERSION_INPUT: ${{ inputs.marketing_version }}
      run: |
        set -euo pipefail
        mkdir -p ./output

        # The run number is the build number. App Store Connect rejects a build
        # whose CFBundleVersion it has seen before, and the project's own value
        # is a static 1 — it would only ever upload once.
        PARAMS=(
          -project "$XCODE_PROJECT"
          -scheme "$XCODE_SCHEME"
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "./output/${APP_NAME}.xcarchive"
          -skipPackageUpdates
          DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"
          PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_IDENTIFIER"
          CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY"
          OTHER_CODE_SIGN_FLAGS="--keychain $SIGN_KEYCHAIN"
          COMPILER_INDEX_STORE_ENABLE=NO
          SWIFT_COMPILATION_MODE=wholemodule
          ONLY_ACTIVE_ARCH=NO
        )
        if [ -n "$MARKETING_VERSION_INPUT" ]; then
          PARAMS+=( MARKETING_VERSION="$MARKETING_VERSION_INPUT" )
        fi

        echo "Building $BUNDLE_IDENTIFIER build ${{ github.run_number }}"
        set -o pipefail
        xcodebuild "${PARAMS[@]}" archive 2>&1 | tee xcodebuild.log

        if [ ! -d "./output/${APP_NAME}.xcarchive" ]; then
          echo "❌ Archive was not created"
          exit 1
        fi
        echo "✅ Archived"

    - name: Upload build logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: xcodebuild-logs
        path: xcodebuild.log
        if-no-files-found: ignore

    - name: Export IPA
      env:
        BUNDLE_IDENTIFIER: ${{ secrets.BUNDLE_IDENTIFIER }}
      run: |
        set -euo pipefail

        cat > ExportOptions.plist <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
                <key>$BUNDLE_IDENTIFIER</key>
                <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
        </dict>
        </plist>
        EOF

        xcodebuild -exportArchive \
          -archivePath "./output/${APP_NAME}.xcarchive" \
          -exportOptionsPlist ./ExportOptions.plist \
          -exportPath ./output \
          -allowProvisioningUpdates

        IPA=$(find ./output -maxdepth 1 -name "*.ipa" -type f | head -1)
        if [ -z "$IPA" ]; then
          echo "❌ No IPA produced"
          ls -lah ./output/
          exit 1
        fi
        mv "$IPA" "./output/${APP_NAME}.ipa"
        du -h "./output/${APP_NAME}.ipa"
        echo "✅ Exported ./output/${APP_NAME}.ipa"

    - name: Archive dSYMs
      run: |
        DSYMS="./output/${APP_NAME}.xcarchive/dSYMs"
        if [ -d "$DSYMS" ]; then
          zip -qry "./output/${APP_NAME}-dSYMs.zip" "$DSYMS"
          echo "✅ Zipped dSYMs"
        fi

    - name: Keep the IPA and dSYMs
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.APP_NAME }}-build-${{ github.run_number }}
        path: |
          ./output/*.ipa
          ./output/*-dSYMs.zip
        retention-days: 30

    - name: Set up the App Store Connect API key
      env:
        API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
        API_PRIVATE_KEY: ${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY }}
      run: |
        set -euo pipefail
        mkdir -p ~/.appstoreconnect/private_keys
        printf '%s' "$API_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
        chmod 600 ~/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8
        echo "✅ Key installed"

    - name: Validate the IPA
      env:
        API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
        API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
      run: |
        # Cheaper than finding out after the upload: this catches missing icons,
        # bad entitlements and duplicate build numbers before anything ships.
        xcrun altool --validate-app \
          --type ios \
          --file "./output/${APP_NAME}.ipa" \
          --apiKey "$API_KEY_ID" \
          --apiIssuer "$API_ISSUER_ID"

    - name: Upload to App Store Connect
      if: ${{ inputs.skip_upload != true }}
      env:
        API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
        API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
      run: |
        xcrun altool --upload-app \
          --type ios \
          --file "./output/${APP_NAME}.ipa" \
          --apiKey "$API_KEY_ID" \
          --apiIssuer "$API_ISSUER_ID" \
          --verbose

    - name: Clean up credentials
      if: always()
      run: |
        rm -f profile.mobileprovision ExportOptions.plist
        rm -rf ~/.appstoreconnect/private_keys
        security delete-keychain "$HOME/Library/Keychains/signing_temp.keychain-db" 2>/dev/null || true
        echo "✅ Credentials removed from the runner"

    - name: Notify Slack
      if: always()
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        STATUS: ${{ job.status }}
      run: |
        if [ -z "$SLACK_WEBHOOK_URL" ]; then
          echo "⚠️ No SLACK_WEBHOOK_URL secret, skipping"
          exit 0
        fi

        if [ "$STATUS" = "success" ]; then
          ICON="✅"; HEADLINE="Build uploaded to App Store Connect"
        else
          ICON="❌"; HEADLINE="Build failed"
        fi

        SHA=$(git log -1 --pretty=%h)
        AUTHOR=$(git log -1 --pretty=%an)
        URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

        TAIL=""
        if [ "$STATUS" != "success" ] && [ -f xcodebuild.log ]; then
          TAIL=$(grep -E "error:|❌" xcodebuild.log | tail -10)
          [ -z "$TAIL" ] && TAIL=$(tail -15 xcodebuild.log)
        fi

        # jq builds the JSON so a quote or newline in a commit message can't break it.
        jq -n \
          --arg text "$ICON OracleBrew — $HEADLINE" \
          --arg headline "$ICON $HEADLINE" \
          --arg build "${{ github.run_number }}" \
          --arg branch "${{ github.ref_name }}" \
          --arg commit "<$URL|$SHA> by $AUTHOR" \
          --arg tail "$TAIL" \
          '{
             text: $text,
             blocks: (
               [
                 {type:"header", text:{type:"plain_text", text:$headline}},
                 {type:"section", fields:[
                   {type:"mrkdwn", text:"*App:*\nOracleBrew"},
                   {type:"mrkdwn", text:"*Build:*\n\($build)"},
                   {type:"mrkdwn", text:"*Branch:*\n\($branch)"},
                   {type:"mrkdwn", text:"*Commit:*\n\($commit)"}
                 ]}
               ]
               + (if $tail == "" then [] else
                   [{type:"section", text:{type:"mrkdwn", text:"*Log tail:*\n```\($tail)```"}}]
                 end)
             )
           }' \
          | curl -sS -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
